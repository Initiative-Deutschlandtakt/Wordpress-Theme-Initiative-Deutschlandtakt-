services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      # Standard: kein Debug-Output. Zur Fehlersuche auf 1 setzen.
      WORDPRESS_DEBUG: 0
    volumes:
      - wp_core:/var/www/html
      # Live-mounted theme: edit files on the host, reload the browser.
      - ./theme/idt-deutschlandtakt:/var/www/html/wp-content/themes/idt-deutschlandtakt

  # One-shot installer: installs WordPress core, activates the theme (which
  # seeds demo pages/posts/menu on activation), and sets pretty permalinks.
  cli:
    image: wordpress:cli-php8.3
    user: "33:33"  # www-data, so it can write into the shared volume
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wp_core:/var/www/html
      - ./theme/idt-deutschlandtakt:/var/www/html/wp-content/themes/idt-deutschlandtakt
      - ./wp-cli/init.sh:/init.sh:ro
    entrypoint: ["bash", "/init.sh"]

volumes:
  db_data:
  wp_core:
