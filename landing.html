  <script>
  /* Skaliert die 1280×800-Bühne proportional in den Viewport und passt die
     Footer-Breite an. In eine IIFE gekapselt und auf .lp-root eingegrenzt,
     damit nichts ins globale WordPress-Scope leakt. */
  (function () {
    function fit() {
      var c = document.getElementById('canvas');
      if (!c) return;
      var stage = c.parentElement;
      /* Verfügbare Breite = tatsächliche Breite der Bühne, NICHT window.innerWidth.
         Der Splash wird in eine WordPress-Content-Spalte (Catch Box) eingebettet,
         die auf breiten Monitoren schmaler bleibt als das Browserfenster. Wurde
         wie früher aus window.innerWidth skaliert, wuchs die (mittig, absolut
         positionierte, in .stage per overflow:hidden beschnittene) Canvas über
         ihre reale Spaltenbreite hinaus und wurde seitlich abgeschnitten. */
      var availW = (stage && stage.clientWidth) || window.innerWidth;
      var availH = window.innerHeight;
      var s = Math.min(availW / 1280, availH / 800);
      c.style.setProperty('--s', s);
      /* Bühnenhöhe an die skalierte Canvas anpassen, statt starrer 100vh —
         verhindert auf schmalen Hochformat-Viewports (Handys) einen
         cremefarbenen/tealfarbenen Leerraum ober-/unterhalb der Bühne. */
      if (stage) stage.style.height = Math.round(800 * s) + 'px';
      var f = document.querySelector('.lp-root .site-footer');
      if (f) f.style.width = Math.round(1280 * s) + 'px';
    }
    window.addEventListener('resize', fit);
    /* Reagiert auch auf Layout-Änderungen der Host-Seite, die kein window-resize
       auslösen (z. B. eine ein-/ausklappende Theme-Sidebar), damit die Skalierung
       zur echten Spaltenbreite passt. */
    if (window.ResizeObserver) {
      var c0 = document.getElementById('canvas');
      if (c0 && c0.parentElement) new ResizeObserver(fit).observe(c0.parentElement);
    }
    fit();
  })();
  </script>
</div>
